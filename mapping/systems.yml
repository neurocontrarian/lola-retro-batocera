# Which picture each Batocera system gets, in every Lola Retro shader set.
#
# Value forms:
#   <name>                a Lola Retro preset: a system preset (systems/<name>) if one exists,
#                         else a preset by device (curved/<name>, flat/<name>), which guesses the
#                         console timing from the frame size
#   {lola: <name>, as: <file name>, params: {LR_X: v}}
#                         the same, with parameters set for this system only
#   stock:<path>          one of Batocera's own shaders (handhelds had LCD screens, not CRTs)
#   none                  no shader
#
# Batocera's shader sets only reach RetroArch cores; systems run by a standalone emulator keep
# their own filters. They are still listed, so switching such a system to a RetroArch core
# (Batocera's per-system "Emulator" option) gets the right picture.
# Systems missing from this list get `default`.

default: consumer-tv-scart-rgb

# Settings over every Lola Retro preset (the defaults StrikeHD settled on). A system's own
# params win over these.
params:
  LR_MASK_PX: 1       # mask on whole screen pixels: no moire below 4K (Lola Retro issue #11)
  LR_SMOOTH: 1        # each screen pixel shows the light averaged over its height: less moire
  LR_DBLEND_AUTO: 1   # RGB and S-Video presets blend 1-pixel dither as composite did
  LR_DAMPER: 0        # no Trinitron damper wires across the picture (issue #16)

# Names older Batocera versions used, kept so older installs get the right picture
old_names: [fba, amiga, msx]

lcd: &lcd stock:handheld/lcd-grid-v2   # handhelds had LCD screens, not tubes

